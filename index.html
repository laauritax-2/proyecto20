<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Configuración de la página -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convertidor de temperatura</title>
    <!-- Archivo de estilos -->
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <!-- Contenedor principal -->
    <main class="contenedor">
        <h1>Convertidor de temperatura</h1>
        <p>Convierte entre Celsius, Fahrenheit y Kelvin.</p>

        <!-- Formulario con los tres campos solicitados -->
        <form id="formulario">
            <label for="valor">Temperatura:</label>
            <input type="number" id="valor" step="any" placeholder="Escribe un valor">

            <label for="origen">Unidad de origen:</label>
            <select id="origen">
                <option value="">Selecciona una unidad</option>
                <option value="C">Celsius (°C)</option>
                <option value="F">Fahrenheit (°F)</option>
                <option value="K">Kelvin (K)</option>
            </select>

            <label for="destino">Unidad de destino:</label>
            <select id="destino">
                <option value="">Selecciona una unidad</option>
                <option value="C">Celsius (°C)</option>
                <option value="F">Fahrenheit (°F)</option>
                <option value="K">Kelvin (K)</option>
            </select>

            <!-- El botón inicia deshabilitado -->
            <button type="submit" id="convertir" disabled>Convertir</button>
        </form>

        <!-- Aquí aparece el resultado -->
        <p id="resultado" aria-live="polite"></p>
    </main>

    <!-- Archivo JavaScript -->
    <script src="script.js"></script>
</body>
</html>
